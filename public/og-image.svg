<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1408;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0a0c;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0d060;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0c;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Top gold border -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#goldH)" />
  <!-- Bottom gold border -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#goldH)" />

  <!-- Corner brackets - Top Left -->
  <line x1="40" y1="20" x2="100" y2="20" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  <line x1="40" y1="20" x2="40" y2="80" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  <!-- Corner brackets - Top Right -->
  <line x1="1100" y1="20" x2="1160" y2="20" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  <line x1="1160" y1="20" x2="1160" y2="80" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  <!-- Corner brackets - Bottom Left -->
  <line x1="40" y1="610" x2="100" y2="610" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  <line x1="40" y1="550" x2="40" y2="610" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  <!-- Corner brackets - Bottom Right -->
  <line x1="1100" y1="610" x2="1160" y2="610" stroke="#d4af37" stroke-width="2" opacity="0.6"/>
  <line x1="1160" y1="550" x2="1160" y2="610" stroke="#d4af37" stroke-width="2" opacity="0.6"/>

  <!-- Camera icon (centered, above text) -->
  <g transform="translate(576, 160)" opacity="0.45">
    <path d="M47 33a3 3 0 0 1-3 3H-20a3 3 0 0 1-3-3V14a3 3 0 0 1 3-3h6l3-5h10l3 5h6a3 3 0 0 1 3 3z" 
          fill="none" stroke="#d4af37" stroke-width="2.5" transform="scale(1.6) translate(-12,-12)"/>
    <circle cx="12" cy="19" r="7" fill="none" stroke="#d4af37" stroke-width="2.5" transform="scale(1.6) translate(-12,-12)"/>
  </g>

  <!-- Main Name -->
  <text x="600" y="290" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="82" 
        font-weight="300"
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="3">Numesh Ravindra</text>

  <!-- PHOTOGRAPHY -->
  <text x="600" y="340" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="22" 
        font-weight="400"
        fill="#d4af37" 
        text-anchor="middle"
        letter-spacing="14">PHOTOGRAPHY</text>

  <!-- Gold divider line -->
  <line x1="480" y1="375" x2="720" y2="375" stroke="url(#goldH)" stroke-width="1" opacity="0.8"/>

  <!-- Specialties -->
  <text x="600" y="420" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="24" 
        font-weight="300"
        fill="rgba(255,255,255,0.6)" 
        text-anchor="middle"
        letter-spacing="4">Wedding · Portrait · Wildlife · Events</text>

  <!-- Location -->
  <text x="600" y="470" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="15" 
        font-weight="400"
        fill="rgba(255,255,255,0.3)" 
        text-anchor="middle"
        letter-spacing="6">MAWANELLA, SRI LANKA · AVAILABLE ISLAND-WIDE</text>

  <!-- Website URL -->
  <text x="600" y="580" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="16" 
        font-weight="300"
        fill="rgba(212,175,55,0.5)" 
        text-anchor="middle"
        letter-spacing="2">www.numeshravindra.me</text>
</svg>